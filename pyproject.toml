[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optomechanics-levitation"
version = "0.1.0"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pyGDM2",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
